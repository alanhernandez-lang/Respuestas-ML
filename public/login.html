<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Iniciar sesión · Agrobolder</title>
<style>
  :root {
    --bg: #f6f7f5; --surface: #ffffff; --text: #1c1e1b; --muted: #6b7169;
    --border: #e2e4df; --accent: #3f8f5f; --accent-strong: #2f7d54; --accent-contrast: #ffffff; --mediation: #a33a3a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171a; --surface: #1d2124; --text: #edf1ec; --muted: #97a098;
      --border: #33393d; --accent: #5cb884; --accent-strong: #79cc9e; --accent-contrast: #0c130e; --mediation: #f08a8a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
  }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 2.5rem 3rem; text-align: center; box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    width: 100%; max-width: 320px;
  }
  .brand-mark {
    display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem;
    width: 40px; height: 40px; border-radius: 9px;
    background: linear-gradient(135deg, var(--accent), var(--accent-strong));
    color: var(--accent-contrast); font-weight: 800; font-size: 0.85rem; letter-spacing: 0.02em;
  }
  h1 { font-size: 1.15rem; margin: 0 0 0.35rem; }
  p { color: var(--muted); font-size: 0.9rem; margin: 0 0 1.5rem; }
  form { display: flex; flex-direction: column; gap: 0.75rem; }
  label { text-align: left; font-size: 0.82rem; color: var(--muted); margin-bottom: -0.4rem; }
  input {
    font: inherit; padding: 0.65rem 0.75rem; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); min-height: 24px;
  }
  input:focus-visible, button:focus-visible {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);
  }
  button {
    font: inherit; padding: 0.65rem 0.75rem; border-radius: 8px; border: none;
    background: var(--accent); color: var(--accent-contrast); cursor: pointer; font-weight: 600;
    min-height: 40px;
  }
  button:hover:not(:disabled) { background: var(--accent-strong); }
  button:disabled { opacity: 0.6; cursor: default; }
  .error { color: var(--mediation); font-size: 0.85rem; margin-top: 1rem; min-height: 1.2em; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand-mark" aria-hidden="true">AB</div>
    <h1>Mensajes post-venta · Agrobolder</h1>
    <p>Inicia sesión con tu cuenta autorizada.</p>
    <form id="loginForm">
      <label for="email">Correo</label>
      <input type="email" id="email" placeholder="tu.correo@agrobolder.com" autocomplete="username" required />
      <label for="password">Contraseña</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required />
      <button type="submit" id="submitBtn">Entrar</button>
    </form>
    <div id="errorMsg" class="error" role="alert" aria-live="assertive"></div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('errorMsg');
      const btn = document.getElementById('submitBtn');
      errorEl.textContent = '';
      btn.disabled = true;
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          throw new Error(data.error || 'No se pudo iniciar sesión');
        }
        window.location.href = '/';
      } catch (err) {
        errorEl.textContent = err.message;
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
