<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Iniciar sesión · Agrobolder</title>
<style>
  :root {
    --bg: #f6f7f5; --surface: #ffffff; --text: #1c1e1b; --muted: #6b7169;
    --border: #e2e4df; --mediation: #a33a3a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
  }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 2.5rem 3rem; text-align: center; box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    max-width: 360px;
  }
  h1 { font-size: 1.15rem; margin: 0 0 0.35rem; }
  p { color: var(--muted); font-size: 0.9rem; margin: 0 0 1.5rem; }
  .g-btn-wrap { display: flex; justify-content: center; min-height: 40px; }
  .error { color: var(--mediation); font-size: 0.85rem; margin-top: 1rem; min-height: 1.2em; }
</style>
</head>
<body>
  <div class="card">
    <h1>Mensajes post-venta · Agrobolder</h1>
    <p>Inicia sesión con tu cuenta de Google autorizada.</p>
    <div class="g-btn-wrap">
      <div id="g_id_onload"
           data-client_id="__GOOGLE_CLIENT_ID__"
           data-callback="handleCredentialResponse">
      </div>
      <div class="g_id_signin" data-type="standard" data-shape="pill" data-theme="outline"></div>
    </div>
    <div id="errorMsg" class="error"></div>
  </div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    async function handleCredentialResponse(response) {
      const errorEl = document.getElementById('errorMsg');
      errorEl.textContent = '';
      try {
        const res = await fetch('/api/auth/google', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ credential: response.credential }),
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          throw new Error(data.error || 'No se pudo iniciar sesión');
        }
        window.location.href = '/';
      } catch (err) {
        errorEl.textContent = err.message;
      }
    }
  </script>
</body>
</html>
